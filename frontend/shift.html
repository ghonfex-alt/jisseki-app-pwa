<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>シフト作成</title>
<link rel="manifest" href="/shift-manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0f172a;color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}

/* ── Header ── */
.hdr{background:#111827;border-bottom:1px solid #1f2937;padding:10px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.hdr-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.app-title{color:#a78bfa;font-weight:700;font-size:13px;white-space:nowrap}

.store-tabs{display:flex;background:#1f2937;border-radius:8px;padding:3px;gap:3px}
.store-tab{flex:1;background:none;border:none;color:#6b7280;border-radius:6px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.store-tab.active{background:#374151;color:#f3f4f6}

.month-nav{display:flex;align-items:center;gap:0}
.mnav-btn{background:#1f2937;border:none;color:#9ca3af;border-radius:6px;padding:5px 11px;font-size:16px;cursor:pointer;line-height:1}
.month-lbl{color:#f3f4f6;font-weight:700;font-size:14px;min-width:76px;text-align:center}

.save-btn{background:#374151;border:none;color:#6b7280;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;margin-left:auto;transition:all .2s}
.save-btn.dirty{background:#7c3aed;color:#fff}

/* ── Legend ── */
.legend{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.legend-chip{display:flex;align-items:center;gap:4px;font-size:10px;color:#9ca3af}
.legend-dot{width:10px;height:10px;border-radius:50%}

/* ── Calendar ── */
.cal-wrap{flex:1;overflow-y:auto;padding:6px 6px 100px;-webkit-overflow-scrolling:touch}
::-webkit-scrollbar{width:0;height:0}

.dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.dow-c{text-align:center;font-size:10px;font-weight:700;padding:2px 0;color:#6b7280}
.dow-c.sun{color:#f87171}.dow-c.sat{color:#60a5fa}

.week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}

.day{background:#1f2937;border-radius:6px;min-height:60px;padding:4px 3px 3px;cursor:pointer;border:1.5px solid transparent;user-select:none;display:flex;flex-direction:column;gap:2px;-webkit-touch-callout:none}
.day:active{opacity:.7}
.day.empty{opacity:0;pointer-events:none}
.day.closed{background:#0a0a0a;border-color:#1f2937}
.day.today{border-color:#7c3aed55}

.dnum{font-size:10px;font-weight:700;color:#6b7280;line-height:1;display:flex;align-items:center;justify-content:space-between}
.day.sun .dnum{color:#f87171}.day.sat .dnum{color:#60a5fa}
.day.closed .dnum{color:#374151}
.closed-x{font-size:8px;color:#4b5563}

.chips{display:flex;flex-wrap:wrap;gap:2px}
.chip{font-size:8px;font-weight:700;padding:1px 5px;border-radius:8px;color:#fff;white-space:nowrap;line-height:1.4}

/* ── Bottom sheet ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none}
.overlay.open{display:block}

.sheet{position:fixed;bottom:0;left:0;right:0;background:#111827;border-radius:16px 16px 0 0;border-top:1px solid #374151;z-index:101;transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);max-height:85vh;display:flex;flex-direction:column}
.sheet.open{transform:translateY(0)}

.sheet-handle{width:36px;height:4px;background:#374151;border-radius:2px;margin:10px auto 0;flex-shrink:0}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;flex-shrink:0}
.sheet-title{font-weight:700;font-size:14px;color:#f3f4f6}
.sheet-close{background:none;border:none;color:#4b5563;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}

.sheet-body{overflow-y:auto;padding:0 16px 16px;flex:1}

.staff-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.staff-btn{display:inline-flex;align-items:center;gap:5px;background:#1f2937;border:2px solid #374151;border-radius:12px;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:700;color:#9ca3af;transition:all .15s;white-space:nowrap}
.staff-btn.on{color:#fff}
.staff-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.5;transition:opacity .15s}
.staff-btn.on .dot{opacity:1}

.sheet-footer{display:flex;gap:8px;flex-shrink:0;padding:0 16px 16px}
.closed-btn{background:#1f2937;border:1px solid #374151;color:#6b7280;border-radius:8px;padding:11px 14px;font-size:12px;cursor:pointer;white-space:nowrap}
.closed-btn.on{background:#7f1d1d22;border-color:#f87171;color:#f87171}
.confirm-btn{flex:1;background:#7c3aed;border:none;color:#fff;border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}

/* ── Toast ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:#1f2937;border:1px solid #374151;color:#f3f4f6;padding:9px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-row">
    <span class="app-title">シフト</span>
    <div class="store-tabs" id="store-tabs"></div>
    <div class="month-nav">
      <button class="mnav-btn" onclick="changeMonth(-1)">‹</button>
      <span class="month-lbl" id="month-lbl">—</span>
      <button class="mnav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <button class="save-btn" id="save-btn" onclick="saveShift()">保存</button>
  </div>
</div>
<div class="legend" id="legend"></div>

<div class="cal-wrap">
  <div class="dow-row" id="dow-row"></div>
  <div id="cal-body"></div>
</div>

<!-- Sheet -->
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-hdr">
    <span class="sheet-title" id="sheet-title">—</span>
    <button class="sheet-close" onclick="closeSheet()">✕</button>
  </div>
  <div class="sheet-body">
    <div class="staff-grid" id="staff-grid"></div>
  </div>
  <div class="sheet-footer">
    <button class="closed-btn" id="closed-btn" onclick="toggleClosed()">— 閉業日</button>
    <button class="confirm-btn" onclick="closeSheet()">確認</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DOW      = ['日','月','火','水','木','金','土'];
const PALETTE  = ['#7c3aed','#2563eb','#16a34a','#d97706','#e11d48','#0891b2','#f97316','#14b8a6','#a21caf'];
// このページはSPA(app.js)を経由せず単独で開かれるため、window.STORE_NAME/_storeIdsを
// 自前でセットする(app.jsのDOMContentLoadedハンドラと同じ役割)。
window.STORE_NAME = window.STORE_NAME || {};
window._storeIds  = window._storeIds  || [];
function storeName(id) { return (window.STORE_NAME || {})[id] || id; }

// ── State ────────────────────────────────────────────────────
const S = {
  year:  new Date().getFullYear(),
  month: new Date().getMonth() + 1,
  store: null,
  shifts: {},    // dateStr → [staffId,...] | null(閉業)
  allStaff: [],
  colors: {},    // staffId → hex
  dirty: false,
};
let sheetDate = null;

// ── Boot ─────────────────────────────────────────────────────
async function boot() {
  try {
    const stores = await api('GET', '/stores');
    window._storeIds = Object.keys(stores);
    window._storeIds.forEach(id => { window.STORE_NAME[id] = stores[id].name || id; });
  } catch(e) { console.warn('store load failed', e); }
  S.store = window._storeIds[0] || null;
  renderStoreTabs();
  try {
    S.allStaff = await api('GET', '/staff') || [];
    assignColors();
    renderLegend();
  } catch(e) { console.warn('staff load failed', e); }
  updateMonthLabel();
  await loadShift();
  renderDowRow();
  renderCal();
}

function renderStoreTabs() {
  const el = document.getElementById('store-tabs');
  if (!el) return;
  const ids = window._storeIds || [];
  if (ids.length <= 1) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = '';
  el.innerHTML = ids.map(id =>
    `<button class="store-tab${id===S.store?' active':''}" id="tab-${id}" onclick="setStore('${id}')">${storeName(id)}</button>`
  ).join('');
}

function assignColors() {
  const storeIds = window._storeIds || [];
  const fallbackSid = storeIds[storeIds.length - 1];
  const byStore = {};
  for (const s of S.allStaff) {
    if (!s.active) continue;
    const key = s.store_id || fallbackSid;
    (byStore[key] = byStore[key] || []).push(s);
  }
  for (const arr of Object.values(byStore)) {
    arr.sort((a,b) => (a.sort_order??99)-(b.sort_order??99));
    arr.forEach((s,i) => { S.colors[s.id] = PALETTE[i % PALETTE.length]; });
  }
  const owner = S.allStaff.find(s => s.is_owner);
  if (owner) S.colors[owner.id] = '#4f46e5';
}

function renderLegend() {
  const staff = S.allStaff.filter(s => s.active && (s.store_id === S.store || s.is_owner))
    .sort((a,b) => (a.sort_order??99)-(b.sort_order??99));
  document.getElementById('legend').innerHTML = staff.map(s =>
    `<span class="legend-chip">
       <span class="legend-dot" style="background:${S.colors[s.id]||'#6b7280'};"></span>
       ${s.name}
     </span>`
  ).join('');
}

// ── API ──────────────────────────────────────────────────────
async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: {'Content-Type':'application/json'},
    body: body != null ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function loadShift() {
  const lsKey = `shift_v2_${S.year}_${pad(S.month)}_${S.store}`;
  try {
    const data = await api('GET', `/shifts/${S.year}/${S.month}`);
    const raw  = (data || {})[S.store] || {};
    S.shifts = {};
    for (const [d, v] of Object.entries(raw)) S.shifts[d] = v; // null or [...]
    localStorage.setItem(lsKey, JSON.stringify(S.shifts));
  } catch(e) {
    try { S.shifts = JSON.parse(localStorage.getItem(lsKey) || '{}'); } catch { S.shifts = {}; }
  }
  S.dirty = false;
  updateSaveBtn();
}

async function saveShift() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = '保存中…';
  const lsKey = `shift_v2_${S.year}_${pad(S.month)}_${S.store}`;
  try {
    await api('PUT', `/shifts/${S.year}/${S.month}/${S.store}`, S.shifts);
    localStorage.setItem(lsKey, JSON.stringify(S.shifts));
    S.dirty = false;
    showToast('✅ 保存しました');
  } catch(e) {
    localStorage.setItem(lsKey, JSON.stringify(S.shifts));
    showToast('⚠️ サーバー保存失敗（ローカルには保存済み）');
  } finally {
    btn.disabled = false; btn.textContent = '保存';
    updateSaveBtn();
  }
}

// ── Store / Month ────────────────────────────────────────────
function setStore(id) {
  if (S.store === id) return;
  if (S.dirty && !confirm('保存していない変更があります。切り替えますか？')) return;
  S.store = id;
  renderStoreTabs();
  renderLegend();
  loadShift().then(renderCal);
}

function changeMonth(d) {
  if (S.dirty && !confirm('保存していない変更があります。続けますか？')) return;
  S.month += d;
  if (S.month > 12) { S.month = 1; S.year++; }
  if (S.month <  1) { S.month = 12; S.year--; }
  updateMonthLabel();
  loadShift().then(renderCal);
}

function updateMonthLabel() {
  document.getElementById('month-lbl').textContent = `${S.year}年${S.month}月`;
}

function updateSaveBtn() {
  const btn = document.getElementById('save-btn');
  btn.classList.toggle('dirty', S.dirty);
}

// ── Calendar ────────────────────────────────────────────────
function renderDowRow() {
  document.getElementById('dow-row').innerHTML =
    DOW.map((d,i) => `<div class="dow-c ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('');
}

function renderCal() {
  const today    = new Date().toISOString().slice(0,10);
  const firstDow = new Date(S.year, S.month-1, 1).getDay();
  const daysInM  = new Date(S.year, S.month, 0).getDate();
  let html = '';

  for (let w = 0; w < 6; w++) {
    const cells = [];
    for (let d = 0; d < 7; d++) {
      const n = w*7 + d - firstDow + 1;
      if (n < 1 || n > daysInM) { cells.push(`<div class="day empty"></div>`); continue; }
      const ds      = `${S.year}-${pad(S.month)}-${pad(n)}`;
      const isClosed = S.shifts[ds] === null;
      const assigned = Array.isArray(S.shifts[ds]) ? S.shifts[ds] : [];
      const cls = ['day', d===0?'sun':d===6?'sat':'', ds===today?'today':'', isClosed?'closed':''].filter(Boolean).join(' ');
      const chipsHtml = isClosed ? '' : assigned.map(sid => {
        const nm = (S.allStaff.find(s=>s.id===sid)?.name || sid).slice(0,3);
        return `<span class="chip" style="background:${S.colors[sid]||'#6b7280'};">${nm}</span>`;
      }).join('');
      cells.push(`
        <div class="${cls}" onclick="openSheet('${ds}')">
          <div class="dnum">${n}${isClosed?'<span class="closed-x">✕</span>':''}</div>
          ${chipsHtml ? `<div class="chips">${chipsHtml}</div>` : ''}
        </div>`);
    }
    if (cells.some(c => !c.includes('class="day empty"'))) {
      html += `<div class="week-row">${cells.join('')}</div>`;
    }
  }
  document.getElementById('cal-body').innerHTML = html;
}

// ── Sheet ────────────────────────────────────────────────────
function openSheet(ds) {
  sheetDate = ds;
  const isClosed = S.shifts[ds] === null;
  const assigned = new Set(Array.isArray(S.shifts[ds]) ? S.shifts[ds] : []);
  const d = new Date(ds + 'T00:00:00');
  document.getElementById('sheet-title').textContent =
    `${S.month}月${d.getDate()}日(${DOW[d.getDay()]}) ${storeName(S.store)}`;

  const staff = S.allStaff.filter(s => s.active && (s.store_id===S.store||s.is_owner))
    .sort((a,b)=>(a.sort_order??99)-(b.sort_order??99));

  document.getElementById('staff-grid').innerHTML = staff.map(s => {
    const on = assigned.has(s.id);
    const c  = S.colors[s.id] || '#6b7280';
    return `<button class="staff-btn ${on?'on':''}" data-sid="${s.id}"
      style="--c:${c};${on?`border-color:${c};background:${c}22;color:${c};`:''}"
      onclick="toggleStaff('${s.id}')">
      <span class="dot"></span>${s.name}
    </button>`;
  }).join('');

  const cb = document.getElementById('closed-btn');
  cb.classList.toggle('on', isClosed);
  cb.textContent = isClosed ? '✓ 閉業日' : '— 閉業日';
  setStaffGridEnabled(!isClosed);

  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}

function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  sheetDate = null;
}

function toggleStaff(sid) {
  if (!sheetDate || S.shifts[sheetDate] === null) return;
  if (!Array.isArray(S.shifts[sheetDate])) S.shifts[sheetDate] = [];
  const idx = S.shifts[sheetDate].indexOf(sid);
  if (idx >= 0) S.shifts[sheetDate].splice(idx, 1);
  else          S.shifts[sheetDate].push(sid);
  if (S.shifts[sheetDate].length === 0) delete S.shifts[sheetDate];

  const isOn = Array.isArray(S.shifts[sheetDate]) && S.shifts[sheetDate].includes(sid);
  const btn  = document.querySelector(`[data-sid="${sid}"]`);
  const c    = S.colors[sid] || '#6b7280';
  if (btn) {
    btn.classList.toggle('on', isOn);
    btn.style.borderColor = isOn ? c : '#374151';
    btn.style.background  = isOn ? c+'22' : '';
    btn.style.color       = isOn ? c : '#9ca3af';
  }
  setDirty();
  renderCal();
}

function toggleClosed() {
  if (!sheetDate) return;
  const nowClosed = S.shifts[sheetDate] === null;
  if (nowClosed) { delete S.shifts[sheetDate]; }
  else           { S.shifts[sheetDate] = null; }
  const isClosed = S.shifts[sheetDate] === null;
  const cb = document.getElementById('closed-btn');
  cb.classList.toggle('on', isClosed);
  cb.textContent = isClosed ? '✓ 閉業日' : '— 閉業日';
  setStaffGridEnabled(!isClosed);
  setDirty();
  renderCal();
}

function setStaffGridEnabled(enabled) {
  const g = document.getElementById('staff-grid');
  g.style.opacity       = enabled ? '1' : '0.25';
  g.style.pointerEvents = enabled ? '' : 'none';
}

// ── Helpers ──────────────────────────────────────────────────
function setDirty() { S.dirty = true; updateSaveBtn(); }
function pad(n) { return String(n).padStart(2,'0'); }

function showToast(msg, ms=2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), ms);
}

boot();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>実績管理</title>
<!--
  audit-loop(2026-11-01)の監査で発見(重大): このファイルはPWA化以前の
  旧シフト画面で、in-app navigation(index.htmlの「シフト」ボタン、
  App.go('shift'))からはどこからも到達できない死んだページだが、
  frontend/sw.jsのCORE_ASSETSにキャッシュされているため、ブックマーク・
  旧リンク・QRコード等で直接URLを開かれると実際に表示されてしまっていた。

  旧シフト画面は db.js/local-api.js を読み込んでおらず、生の fetch() で
  存在しないサーバーAPIを叩く作りのまま(このPWAはサーバーを持たない)だった
  ため、API呼び出しは全て失敗し、代わりにこのページ専用の別のlocalStorage
  キー("shift_v2_<year>_<month>_<store>")へフォールバック保存していた。
  この別ストレージは本体アプリのIndexedDBとは完全に別物のため、ここで
  シフトを編集して「保存しました」(実際に表示される)を見ても、本体の
  シフト画面には一切反映されない——気づかれにくい形でシフト編集が
  消えたように見える事故を起こしうる、確認済みの重大なリスクだった。

  実装をPWA対応に作り直すのではなく、このページ自体を本体アプリへの
  リダイレクトに置き換える(ルート直下のindex.htmlと同じパターン)。
  本体のシフト画面はindex.html内のSPA(frontend/shift-app.js)で正しく
  動作しており、そちらに「シフト」ボタンから進んでもらう。
-->
<meta http-equiv="refresh" content="0; url=index.html">
<script>location.replace("index.html");</script>
</head>
<body>
<p>読み込み中... 自動で移動しない場合は<a href="index.html">こちら</a>をタップしてください。</p>
</body>
</html>
